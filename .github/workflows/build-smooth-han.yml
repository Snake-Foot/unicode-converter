name: Build small Han outline font

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-smooth-han.yml"
      - "scripts/build-smooth-han-subset.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned font subsetting tools
        run: python -m pip install "fonttools==4.60.1" "brotli==1.1.0"
      - name: Download licensed font and extract six Han glyphs
        run: python scripts/build-smooth-han-subset.py
      - name: Commit compact font subset and required attribution
        run: |
          mkdir -p /tmp/han-font-outputs
          cp fonts/han/YKTSmoothHanB.woff2 fonts/han/YKTSmoothHanB-LICENSE.txt fonts/han/YKTSmoothHanB-SOURCE.md /tmp/han-font-outputs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --detach origin/main
          mkdir -p fonts/han
          cp /tmp/han-font-outputs/* fonts/han/
          git add fonts/han/YKTSmoothHanB.woff2 fonts/han/YKTSmoothHanB-LICENSE.txt fonts/han/YKTSmoothHanB-SOURCE.md
          if git diff --cached --quiet; then
            echo "Smooth Han font already current"
          else
            git commit -m "Add licensed six-glyph smooth Han WOFF2 subset"
            git push origin HEAD:main
          fi
