name: Inspect smooth Han font candidates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-smooth-han.yml"
      - "scripts/probe-smooth-han.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "fonttools==4.60.1"
      - name: Compare real glyph coverage and contours
        run: python scripts/probe-smooth-han.py
