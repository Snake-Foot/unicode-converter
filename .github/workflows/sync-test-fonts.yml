name: Sync test fonts to production

on:
  push:
    paths:
      - ".github/workflows/sync-test-fonts.yml"

permissions:
  contents: write

jobs:
  sync-fonts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone test repository
        run: |
          git clone --depth 1 https://github.com/YKT-lab/Unicode-Converter-discription_test.git /tmp/font-test

      - name: Sync font files
        run: |
          mkdir -p fonts

          rsync -av --delete \
            --exclude "japanese/NotoSansJP-Variable.ttf" \
            --exclude ".keep" \
            /tmp/font-test/fonts/ \
            ./fonts/

      - name: Commit synchronized fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fonts

          if git diff --cached --quiet; then
            echo "Fonts are already synchronized"
          else
            git commit -m "Sync fonts from description test repo"
            git push
          fi
