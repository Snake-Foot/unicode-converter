  <style>

    /* ================================= */
    /* ローカルフォント */
    /* ================================= */

    @font-face {
      font-family: "Tangut Extended";

      src:
        url("./tangut-extended.woff2")
        format("woff2");

      font-display: swap;
    }


    @font-face {
      font-family: "Plangothic P1";

      src:

      font-display: swap;
    }


    @font-face {
      font-family: "Plangothic P2";

    }


    @font-face {

    body {

      color: #1d1d1f;

      width: 100%;

    }


    .box {
      margin-bottom: 20px;

      padding: 20px;

      border-radius: 18px;

    h2 {
      margin:

    textarea,
    input {
      width: 100%;

      border-radius: 12px;

      background: #fff;

      color: #1d1d1f;

      font: inherit;

      font-size: 17px;

      outline: none;
    }


    textarea {
      min-height: 100px;

      resize: vertical;
    }


    textarea:focus,
    input:focus {

    .result {

    .character-result {
      min-height: 90px;

      font-size: 48px;

    }

      position: relative;

      display: inline-flex;

      min-width: 1em;

      min-height: 1.3em;

      align-items: center;

      justify-content: center;

      vertical-align: middle;
    }


    /* ================================= */
    /* 無効なUnicode */
    /* ================================= */

    .invalid-unicode {
      display: inline-flex;

      align-items: center;

      margin:

      padding:
        4px 8px;

      border-radius: 7px;

      cursor: pointer;

      transition:
        opacity 0.15s,
        transform 0.05s;
    }


    button:active:not(:disabled) {

        scale(0.98);
    }


    button:disabled {
      opacity: 0.35;

      cursor: default;
    }


    /* ================================= */
    /* ランダム操作 */
    /* ================================= */

    .random-buttons {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    /* ================================= */
    /* 今日の一文字 */
    /* ================================= */

    #dailyCharacterBox {

    #dailyTitle {

      font-size: 15px;

      font-weight: 600;

      color: #666;
    }


    #dailyCharacter {
      position: relative;

      display: flex;

      width: 100%;

      min-height: 130px;

      align-items: center;

      justify-content: center;

      font-size: 92px;

      line-height: 1.2;
    }


    #dailyCode {
      margin-top: 6px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,

        monospace;

      font-size: 17px;

      color: #555;
    }


    #dailyResearch {
      margin-top: 14px;
    }


    #dailyResearchLink {
      color: #007aff;

      text-decoration: none;

    }


    #dailyResearchLink:hover {
      text-decoration: underline;
    }


    #dailyResearchLink.disabled {
      opacity: 0;

      pointer-events: none;

    /* ================================= */
    /* フォント */
    /* ================================= */

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",

    }


    .font-kawi {

    }


    .font-toto {

        "Noto Serif Toto",

    }


    .font-tangut {

    }


    .font-khitan {

        "Noto Serif Khitan Small Script",

    }


    .font-cuneiform {
      font-family:
        "Noto Sans Cuneiform",

    }


    .font-egyptian {

    .font-egyptian-extended {

    .font-tangsa {

}


.font-indic-siyaq {

}


/*
  「空白なのか分からない」
  状態を避けるための表示
*/

.invisible-unicode {
  display: inline-flex;

  align-items: center;

  margin:
    4px 6px;

  padding:
    4px 8px;

  border-radius: 7px;

  background: #eeeeee;

  color: #666;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  line-height: 1.3;

  vertical-align: middle;

    .font-cjk-ext {
      font-family:
        "Plangothic P1",
        "Plangothic P2",
        "BabelStone Han",
        serif;
    }


    /* ================================= */
    /* 読み込み中 */
    /* ================================= */

    .loading-character {
      position: relative;

      color:
        transparent !important;
    }


    .loading-character::after {
      content: "";

      position: absolute;

      width: 28px;

      height: 28px;

      top: 50%;

      left: 50%;

      margin:
        -14px 0
        0 -14px;

      border:
        3px solid
        rgba(
          120,
          120,
          120,
          0.25
        );

      border-top-color:
        rgba(
          80,
          80,
          80,
          0.9
        );

      border-radius: 50%;

      animation:
        spinner 0.8s
        linear infinite;
    }


    @keyframes spinner {
      to {
        transform:
          rotate(360deg);
      }
    }


    .font-credit {
      margin-top: 8px;

      text-align: center;

      color: #888;

    @media (
      max-width:
      520px

      }

<body>

  <main>

    <h1>
      文字 ⇄ Unicode
    </h1>


    <!-- 今日の一文字 -->

    <section
      id="dailyCharacterBox"
    >

      <div
        id="dailyTitle"
      >
        今日の一文字
      </div>


      <div
        id="dailyCharacter"
        class="
          character
          loading-character
        "

        ?
      </div>


      <div

        読み込み中…
      </div>


      <div
        id="dailyResearch"
      >

        <a

    </section>


    <!-- 文字 → Unicode -->

    <section
      class="box"
    >

      <h2>
        文字 → Unicode
      </h2>


      <textarea
        id="charInput"
        placeholder="文字を入力"
      ></textarea>


      <div
        id="unicodeOutput"
        class="
          result
          unicode-result
        "
      ></div>


      <button
        id="clearChar"

      >

    </section>


    <!-- Unicode → 文字 -->

    <section
      class="box"
    >

      <h2>
        Unicode → 文字
      </h2>


      <input
        id="unicodeInput"
        type="text"
        placeholder="例: 1E290 または U+1E290"
      >


      <div
        class="hint"
      >
        U+1E290 / 1E290 /
        0x1E290 に対応。
        複数入力は空白・改行・カンマで区切れます。
      </div>


      <div
        class="random-buttons"
      >

        <button
          id="backUnicode"
          type="button"
          class="back-button"

          type="button"
          class="random-button"
          data-random-count="5"

        <button
          type="button"
          class="random-button"
          data-random-count="10"
        >

        </button>


        <button
          type="button"
          class="random-button"
          data-random-count="100"
        >

        </button>

      </div>


      <div
        id="charOutput"
        class="
          result
          character-result
        "
      ></div>


      <button
        id="clearUnicode"
        type="button"
      >
        クリア
      </button>

    </section>


    <div
      class="font-credit"
    >
      Fonts:
      Noto Fonts /
      Plangothic Project /
      Egyptology Extended
    </div>

  </main>


  <script>

    const charInput =
      document.getElementById(
        "charInput"
      );


    const unicodeInput =
      document.getElementById(
        "unicodeInput"
      );


    const unicodeOutput =
      document.getElementById(
        "unicodeOutput"
      );


    const charOutput =
      document.getElementById(
        "charOutput"
      );


    const clearChar =
      document.getElementById(
        "clearChar"
      );


    const clearUnicode =
      document.getElementById(
        "clearUnicode"
      );


    const backUnicode =
      document.getElementById(
        "backUnicode"
      );


    const dailyCharacter =
      document.getElementById(
        "dailyCharacter"
      );


    const dailyCode =
      document.getElementById(
        "dailyCode"
      );


    const dailyResearchLink =
      document.getElementById(
        "dailyResearchLink"
      );


    /* ================================= */
    /* フォント判定 */
    /* ================================= */

    function getFontClass(
      codePoint
    ) {

      if (
        codePoint >= 0x11F00 &&
        codePoint <= 0x11F5F
      ) {
        return "font-kawi";
      }


      if (
        codePoint >= 0x1E290 &&
        codePoint <= 0x1E2BF
      ) {
        return "font-toto";
      }


      if (
        (
          codePoint >= 0x187F8 &&
          codePoint <= 0x187FF
        )
        ||
        (
          codePoint >= 0x18D09 &&
          codePoint <= 0x18D1E
        )
        ||
        (
          codePoint >= 0x18D80 &&
          codePoint <= 0x18DFF
        )
      ) {
        return "font-tangut-extended";
      }


      if (
        codePoint === 0x16FE0
      ) {
        return "font-tangut";
      }


      if (
  (
    codePoint >= 0x17000 &&
    codePoint <= 0x187F7
  )
  ||
  (
    codePoint >= 0x18800 &&
    codePoint <= 0x18AFF
  )
  ||
  (
    codePoint >= 0x18D00 &&
    codePoint <= 0x18D08
  )
) {
  return "font-tangut";
}


      if (
        codePoint === 0x16FE1
      ) {
        return "font-nushu";
      }


      if (
        codePoint >= 0x1B170 &&
        codePoint <= 0x1B2FF
      ) {
        return "font-nushu";
      }


      if (
        codePoint >= 0x18B00 &&
        codePoint <= 0x18CFF
      ) {
        return "font-khitan";
      }


      if (
        codePoint >= 0x12000 &&
        codePoint <= 0x1254F
      ) {
        return "font-cuneiform";
      }


      if (
        codePoint >= 0x13460 &&
        codePoint <= 0x143FF
      ) {
        return "font-egyptian-extended";
      }


      if (
        codePoint >= 0x13000 &&
        codePoint <= 0x1345F
      ) {
        return "font-egyptian";
      }


      if (
        codePoint >= 0x14400 &&
        codePoint <= 0x1467F
      ) {
        return "font-anatolian";
      }


      if (
        codePoint >= 0x16A70 &&
        codePoint <= 0x16ACF
      ) {
        return "font-tangsa";
      }


      if (
        codePoint >= 0x119A0 &&
        codePoint <= 0x119FF
      ) {
        return "font-nandinagari";
      }


      if (
  codePoint >= 0x1D000 &&
  codePoint <= 0x1D24F
) {
  return "font-music";
}


      if (
        codePoint >= 0x1D800 &&
        codePoint <= 0x1DAAF
      ) {
        return "font-signwriting";
      }


      if (
        codePoint >= 0x10E60 &&
        codePoint <= 0x10E7F
      ) {
        return "font-symbols2";
      }

      /*
  Indic Siyaq Numbers
*/

if (
  codePoint >= 0x1EC70 &&
  codePoint <= 0x1ECBF
) {
  return "font-indic-siyaq";
}


/*
  Arabic Mathematical
  Alphabetic Symbols
*/

if (
  codePoint >= 0x1EE00 &&
  codePoint <= 0x1EEFF
) {
  return "font-math";
}


/*
  Symbols for
  Legacy Computing Supplement
*/

if (
  codePoint >= 0x1CC00 &&
  codePoint <= 0x1CEBF
) {
  return "font-symbols2";
}


/*
  Symbols for
  Legacy Computing
*/

if (
  codePoint >= 0x1FB00 &&
  codePoint <= 0x1FBFF
) {
  return "font-symbols2";
}


      if (
        codePoint >= 0x20000 &&
        codePoint <= 0x2EE5F
      ) {
        return "font-cjk-ext";
      }


      if (
        codePoint >= 0x2F800 &&
        codePoint <= 0x2FA1F
      ) {
        return "font-cjk-ext";
      }


      if (
        codePoint >= 0x30000 &&
        codePoint <= 0x3347F
      ) {
        return "font-cjk-ext";
      }


      return "font-normal";
    }


    /* ================================= */
    /* Webフォント名 */
    /* ================================= */

    function getWebFontNames(
      codePoint
    ) {

      const fontClass =
        getFontClass(
          codePoint
        );


      switch (
        fontClass
      ) {

        case "font-kawi":
          return [
            "Noto Sans Kawi"
          ];


        case "font-toto":
          return [
            "Noto Serif Toto"
          ];


        case "font-tangut":
          return [
            "Noto Serif Tangut"
          ];


        case "font-tangut-extended":
          return [
            "Tangut Extended",
            "Noto Serif Tangut"
          ];


        case "font-nushu":
          return [
            "Noto Sans Nushu"
          ];


        case "font-khitan":
          return [
            "Noto Serif Khitan Small Script"
          ];


        case "font-cuneiform":
          return [
            "Noto Sans Cuneiform"
          ];


        case "font-egyptian":
          return [
            "Noto Sans Egyptian Hieroglyphs"
          ];


        case "font-egyptian-extended":
          return [
            "Egyptology Extended"
          ];


        case "font-anatolian":
          return [
            "Noto Sans Anatolian Hieroglyphs"
          ];


        case "font-tangsa":
          return [
            "Noto Sans Tangsa"
          ];


        case "font-nandinagari":
          return [
            "Noto Sans Nandinagari"
          ];


        case "font-music":
          return [
            "Noto Music"
          ];


        case "font-signwriting":
          return [
            "Noto Sans SignWriting"
          ];


        case "font-symbols2":
          return [
            "Noto Sans Symbols 2"
          ];

        case "font-math":
  return [
    "Noto Sans Math"
  ];


case "font-indic-siyaq":
  return [
    "Noto Sans Indic Siyaq Numbers"
  ];


        case "font-cjk-ext":
          return [
            "Plangothic P1",
            "Plangothic P2",
            "BabelStone Han"
          ];


        default:
          return [];
      }
    }


    /* ================================= */
    /* フォント待機 */
    /* ================================= */

    function sleep(
      milliseconds
    ) {

      return new Promise(
        (resolve) => {

          setTimeout(
            resolve,
            milliseconds
          );

        }
      );
    }


    async function waitForCharacterFont(
      codePoint,
      character
    ) {

      const fontNames =
        getWebFontNames(
          codePoint
        );


      if (
        fontNames.length === 0
      ) {
        return;
      }


      if (
        !document.fonts
      ) {

        await sleep(
          1000
        );

        return;
      }


      try {

        const fontLoads =
          fontNames.map(
            (fontName) => {

              return document.fonts.load(
                `72px "${fontName}"`,
                character
              );

            }
          );


        await Promise.race(
          [

            Promise.allSettled(
              fontLoads
            ),

            sleep(
              6000
            )

          ]
        );

      } catch (
        error
      ) {

        console.warn(
          "Font loading failed:",
          error
        );

      }
    }


    /* ================================= */
    /* 文字 → Unicode */
    /* ================================= */

    function convertCharacters() {

      const text =
        charInput.value;


      if (
        text.length === 0
      ) {

        unicodeOutput.textContent =
          "";

        return;
      }


      const result =
        Array.from(
          text
        )
        .map(
          (character) => {

            const codePoint =
              character.codePointAt(
                0
              );


            return (
              "U+" +
              codePoint
                .toString(
                  16
                )
                .toUpperCase()
            );

          }
        );


      unicodeOutput.textContent =
        result.join(
          " "
        );
    }


    /* ================================= */
    /* Unicode解析 */
    /* ================================= */

    function parseUnicodeToken(
      token
    ) {

      let value =
        token.trim();


      if (
        value.length === 0
      ) {
        return null;
      }


      value =
        value.replace(
          /^U\+/i,
          ""
        );


      value =
        value.replace(
          /^0x/i,
          ""
        );


      if (
        !/^[0-9A-F]+$/i.test(
          value
        )
      ) {
        return null;
      }


      const codePoint =
        parseInt(
          value,
          16
        );


      if (
        !Number.isInteger(
          codePoint
        )
      ) {
        return null;
      }


      if (
        codePoint < 0 ||
        codePoint > 0x10FFFF
      ) {
        return null;
      }


      if (
        codePoint >= 0xD800 &&
        codePoint <= 0xDFFF
      ) {
        return null;
      }


      return codePoint;
    }


    /* ================================= */
    /* 空白・不可視文字の判定 */
    /* ================================= */

    const knownInvisibleCodePoints =
      new Set([
        0x115F,
        0x1160,
        0x2800,
        0x3164,
        0xFFA0
      ]);


    function isInvisibleCharacter(
      codePoint,
      character
    ) {

      if (
        knownInvisibleCodePoints.has(
          codePoint
        )
      ) {
        return true;
      }


      if (
        /\p{Default_Ignorable_Code_Point}/u
          .test(
            character
          )
      ) {
        return true;
      }


      return false;
    }


    /* ================================= */
    /* 実際の描画状態を調べる */
    /* ================================= */

    const glyphCanvas =
      document.createElement(
        "canvas"
      );


    glyphCanvas.width =
      220;


    glyphCanvas.height =
      220;


    const glyphContext =
      glyphCanvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );


    function getGlyphSignature(
      character,
      fontFamily
    ) {

      glyphContext.clearRect(
        0,
        0,
        glyphCanvas.width,
        glyphCanvas.height
      );


      glyphContext.font =
        `100px ${fontFamily}`;


      glyphContext.textBaseline =
        "alphabetic";


      glyphContext.fillStyle =
        "#000";


      glyphContext.fillText(
        character,
        40,
        150
      );


      const imageData =
        glyphContext.getImageData(
          0,
          0,
          glyphCanvas.width,
          glyphCanvas.height
        );


      const data =
        imageData.data;


      let ink =
        0;


      let hash =
        2166136261;


      for (
        let i = 3;
        i < data.length;
        i += 4
      ) {

        const alpha =
          data[i];


        if (
          alpha > 0
        ) {
          ink++;
        }


        hash ^=
          alpha;


        hash =
          Math.imul(
            hash,
            16777619
          );

      }


      return {
        ink,
        hash:
          hash >>> 0
      };
    }


    function isRenderedBlank(
      character,
      fontFamily
    ) {

      const signature =
        getGlyphSignature(
          character,
          fontFamily
        );


      return (
        signature.ink === 0
      );
    }


    /*
      □ や三本線など、
      フォントに文字がない時に
      ブラウザが表示する代替字形を検出する。

      「絶対に完全」ではないが、
      未割り当て文字を同じフォントで描画して比較することで
      かなり高い確率で判別できる。
    */

    function looksLikeMissingGlyph(
      character,
      fontFamily
    ) {

      const target =
        getGlyphSignature(
          character,
          fontFamily
        );


      if (
        target.ink === 0
      ) {
        return false;
      }


      const missing1 =
        getGlyphSignature(
          String.fromCodePoint(
            0x10FFFF
          ),
          fontFamily
        );


      const missing2 =
        getGlyphSignature(
          String.fromCodePoint(
            0x0378
          ),
          fontFamily
        );


      const matches1 =
        missing1.ink > 0
        &&
        target.ink ===
          missing1.ink
        &&
        target.hash ===
          missing1.hash;


      const matches2 =
        missing2.ink > 0
        &&
        target.ink ===
          missing2.ink
        &&
        target.hash ===
          missing2.hash;


      return (
        matches1 ||
        matches2
      );
    }


    /* ================================= */
    /* 小さすぎる字形の自動補正 */
    /* ================================= */

    function getGlyphScaleFactor(
      element,
      codePoint,
      character
    ) {

      /*
        今回は問題が確認されている
        Egyptian Hieroglyphs Extended-A
        だけ補正する。
      */

      if (
        codePoint < 0x13460 ||
        codePoint > 0x143FF
      ) {
        return 1;
      }


      const style =
        getComputedStyle(
          element
        );


      const fontFamily =
        style.fontFamily;


      glyphContext.font =
        `100px ${fontFamily}`;


      const metrics =
        glyphContext.measureText(
          character
        );


      const width =
        Math.abs(
          metrics.actualBoundingBoxLeft
        )
        +
        Math.abs(
          metrics.actualBoundingBoxRight
        );


      const height =
        Math.abs(
          metrics.actualBoundingBoxAscent
        )
        +
        Math.abs(
          metrics.actualBoundingBoxDescent
        );


      const size =
        Math.max(
          width,
          height
        );


      if (
        !Number.isFinite(
          size
        )
        ||
        size <= 0
      ) {
        return 1;
      }


      /*
        普通の大きさなら変更しない。
      */

      if (
        size >= 52
      ) {
        return 1;
      }


      /*
        小さいものだけ、
        最大辺がだいたい65になるまで拡大。
      */

      const scale =
        65 /
        size;


      return Math.min(
        5,
        Math.max(
          1,
          scale
        )
      );
    }


    function applyGlyphScale(
      element,
      codePoint,
      character
    ) {

      const scale =
        getGlyphScaleFactor(
          element,
          codePoint,
          character
        );


      if (
        scale <= 1.05
      ) {
        return;
      }


      element.style.transform =
        `scale(${scale})`;


      element.style.transformOrigin =
        "center";


      /*
        横の文字との重なり防止。
      */

      const margin =
        Math.min(
          1,
          (
            scale - 1
          ) * 0.25
        );


      element.style.marginLeft =
        `${margin}em`;


      element.style.marginRight =
        `${margin}em`;
    }


    function applyDailyGlyphScale(
      element,
      codePoint,
      character
    ) {

      const scale =
        getGlyphScaleFactor(
          element,
          codePoint,
          character
        );


      if (
        scale <= 1.05
      ) {
        return;
      }


      const baseSize =
        window.matchMedia(
          "(max-width: 520px)"
        ).matches
          ? 78
          : 92;


      const newSize =
        Math.min(
          260,
          baseSize *
          scale
        );


      element.style.fontSize =
        `${newSize}px`;
    }


    /* ================================= */
    /* 表示状態ラベル */
    /* ================================= */

    function makeStatusSpan(
      text
    ) {

      const span =
        document.createElement(
          "span"
        );


      span.textContent =
        text;


      span.style.display =
        "inline-flex";


      span.style.alignItems =
        "center";


      span.style.margin =
        "4px 6px";


      span.style.padding =
        "4px 8px";


      span.style.borderRadius =
        "7px";


      span.style.background =
        "#eeeeee";


      span.style.color =
        "#666";


      span.style.fontFamily =
        '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';


      span.style.fontSize =
        "13px";


      span.style.fontWeight =
        "500";


      span.style.lineHeight =
        "1.3";


      span.style.verticalAlign =
        "middle";


      span.style.whiteSpace =
        "nowrap";


      return span;
    }


    /* ================================= */
    /* ランダムUnicode生成 */
    /* ================================= */

    function secureRandomInteger(
      max
    ) {

      const range =
        0x100000000;


      const limit =
        Math.floor(
          range /
          max
        ) * max;


      const array =
        new Uint32Array(
          1
        );


      while (
        true
      ) {

        crypto.getRandomValues(
          array
        );


        const value =
          array[0];


        if (
          value < limit
        ) {

          return (
            value %
            max
          );

        }
      }
    }


    function isUsableRandomCharacter(
      codePoint
    ) {

      if (
        codePoint >= 0xD800 &&
        codePoint <= 0xDFFF
      ) {
        return false;
      }


      const character =
        String.fromCodePoint(
          codePoint
        );


      /*
        空白・不可視文字を除外
      */

      if (
        isInvisibleCharacter(
          codePoint,
          character
        )
      ) {
        return false;
      }


      if (
        !/\p{Assigned}/u.test(
          character
        )
      ) {
        return false;
      }


      if (
        /\p{Cc}/u.test(
          character
        )
      ) {
        return false;
      }


      if (
        /\p{Cf}/u.test(
          character
        )
      ) {
        return false;
      }


      if (
        /\p{Co}/u.test(
          character
        )
      ) {
        return false;
      }


      if (
        /\p{M}/u.test(
          character
        )
      ) {
        return false;
      }


      if (
        /\p{Z}/u.test(
          character
        )
      ) {
        return false;
      }


      return true;
    }


    function generateRandomCodePoint() {

      while (
        true
      ) {

        const codePoint =
          secureRandomInteger(
            0x110000
          );


        if (
          isUsableRandomCharacter(
            codePoint
          )
        ) {

          return codePoint;

        }
      }
    }


    /* ================================= */
    /* 戻る履歴 */
    /* ================================= */

    const unicodeHistory =
      [];


    function updateBackButton() {

      backUnicode.disabled =
        unicodeHistory.length === 0;

    }


    function saveUnicodeHistory() {

      const currentValue =
        unicodeInput.value;


      const lastValue =
        unicodeHistory[
          unicodeHistory.length - 1
        ];


      if (
        currentValue === lastValue
      ) {
        return;
      }


      unicodeHistory.push(
        currentValue
      );


      if (
        unicodeHistory.length > 50
      ) {

        unicodeHistory.shift();

      }


      updateBackButton();
    }


    function goBackUnicode() {

      if (
        unicodeHistory.length === 0
      ) {
        return;
      }


      unicodeRun++;


      const previousValue =
        unicodeHistory.pop();


      unicodeInput.value =
        previousValue;


      updateBackButton();


      convertUnicode();
    }


    /* ================================= */
    /* ランダム生成 */
    /* ================================= */

    function generateRandomUnicode(
      count
    ) {

      saveUnicodeHistory();


      const values =
        [];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const codePoint =
          generateRandomCodePoint();


        values.push(
          "U+" +
          codePoint
            .toString(
              16
            )
            .toUpperCase()
        );

      }


      unicodeInput.value =
        values.join(
          " "
        );


      convertUnicode();
    }


    /* ================================= */
    /* Unicode → 文字 */
    /* ================================= */

    let unicodeRun =
      0;


    async function convertUnicode() {

      const currentRun =
        ++unicodeRun;


      const raw =
        unicodeInput.value.trim();


      if (
        raw.length === 0
      ) {

        charOutput.textContent =
          "";

        return;
      }


      const tokens =
        raw
          .split(
            /[\s,]+/
          )
          .filter(
            Boolean
          );


      charOutput.className =
        "result character-result";


      charOutput.textContent =
        "";


      const promises =
        [];


      for (
        const token of tokens
      ) {

        const codePoint =
          parseUnicodeToken(
            token
          );


        if (
          codePoint === null
        ) {

          const errorSpan =
            document.createElement(
              "span"
            );


          errorSpan.className =
            "invalid-unicode";


          errorSpan.textContent =
            "無効: " +
            token;


          charOutput.appendChild(
            errorSpan
          );


          continue;
        }


        const character =
          String.fromCodePoint(
            codePoint
          );


        /*
          Unicodeとしては有効だが、
          本来見えない文字
        */

        if (
          isInvisibleCharacter(
            codePoint,
            character
          )
        ) {

          const status =
            makeStatusSpan(
              "不可視: U+" +
              codePoint
                .toString(
                  16
                )
                .toUpperCase()
            );


          charOutput.appendChild(
            status
          );


          continue;
        }


        const fontClass =
          getFontClass(
            codePoint
          );


        const fontNames =
          getWebFontNames(
            codePoint
          );


        const span =
          document.createElement(
            "span"
          );


        span.className =
          "character-span " +
          fontClass;


        span.textContent =
          character;


        if (
          fontNames.length > 0
        ) {

          span.classList.add(
            "loading-character"
          );

        }


        charOutput.appendChild(
          span
        );


        /*
          Webフォントがある場合
        */

        if (
          fontNames.length > 0
        ) {

          const promise =
            waitForCharacterFont(
              codePoint,
              character
            )
            .then(
              () => {

                if (
                  currentRun !==
                  unicodeRun
                ) {
                  return;
                }


                span.classList.remove(
                  "loading-character"
                );


                const style =
                  getComputedStyle(
                    span
                  );


                const fontFamily =
                  style.fontFamily;


                /*
                  本当に何も描画されない
                */

                if (
                  isRenderedBlank(
                    character,
                    fontFamily
                  )
                ) {

                  const replacement =
                    makeStatusSpan(
                      "空白: U+" +
                      codePoint
                        .toString(
                          16
                        )
                        .toUpperCase()
                    );


                  span.replaceWith(
                    replacement
                  );


                  return;
                }


                /*
                  □ / 三本線などの
                  Missing Glyph
                */

                if (
                  looksLikeMissingGlyph(
                    character,
                    fontFamily
                  )
                ) {

                  const replacement =
                    makeStatusSpan(
                      "未対応: U+" +
                      codePoint
                        .toString(
                          16
                        )
                        .toUpperCase()
                    );


                  span.replaceWith(
                    replacement
                  );


                  return;
                }


                /*
                  表示できたが
                  極端に小さい場合
                */

                applyGlyphScale(
                  span,
                  codePoint,
                  character
                );

              }
            );


          promises.push(
            promise
          );

        } else {

          /*
            専用Webフォントを使わない文字も
            描画結果を確認する。
          */

          const style =
            getComputedStyle(
              span
            );


          const fontFamily =
            style.fontFamily;


          if (
            isRenderedBlank(
              character,
              fontFamily
            )
          ) {

            const replacement =
              makeStatusSpan(
                "空白: U+" +
                codePoint
                  .toString(
                    16
                  )
                  .toUpperCase()
              );


            span.replaceWith(
              replacement
            );


          } else if (
            looksLikeMissingGlyph(
              character,
              fontFamily
            )
          ) {

            const replacement =
              makeStatusSpan(
                "未対応: U+" +
                codePoint
                  .toString(
                    16
                  )
                  .toUpperCase()
              );


            span.replaceWith(
              replacement
            );

          }

        }
      }


      await Promise.all(
        promises
      );
    }


    /* ================================= */
    /* イベント */
    /* ================================= */

    charInput.addEventListener(
      "input",

      }
    );


    clearUnicode.addEventListener(

        unicodeRun++;


        unicodeInput.value =
          "";


        charOutput.textContent =
          "";


        unicodeInput.focus();

      }
    );


    /* ================================= */
    /* JST日付 */
    /* ================================= */

    function getJSTDateString() {

      const parts =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone:
              "Asia/Tokyo",

            year:
              "numeric",

            month:
              "2-digit",

            day:
              "2-digit"
          }
        )
        .formatToParts(
          new Date()
        );


      const part =
        (type) =>
          parts.find(
            (p) =>
              p.type === type
          )?.value;


      return (
        part(
          "year"
        )
        +
        "-"
        +
        part(
          "month"
        )
        +
        "-"
        +
        part(
          "day"
        )
      );
    }


    /* ================================= */
    /* 今日の一文字 */
    /* ================================= */

    async function loadDailyCharacter() {

      /*
        前回の自動拡大をリセット
      */

      dailyCharacter.style.fontSize =
        "";


      dailyCharacter.style.transform =
        "";


      dailyCharacter.style.marginLeft =
        "";


      dailyCharacter.style.marginRight =
        "";


      dailyCharacter.className =
        "character loading-character";


      dailyCharacter.textContent =
        "?";


      dailyCode.textContent =
        "読み込み中…";


      dailyResearchLink
        .classList
        .add(
          "disabled"
        );


      dailyResearchLink.href =
        "#";


      try {

        const response =
          await fetch(
            "./daily.json?t=" +
            Date.now(),
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "daily.json load failed"
          );

        }


        const data =
          await response.json();


        const today =
          getJSTDateString();


        const entries =
          [
            data.current,
            data.next
          ]
          .filter(
            Boolean
          );


        const entry =
          entries.find(
            (item) =>
              item.date === today
          );


        if (
          !entry
        ) {

          throw new Error(
            "today entry not found"
          );

        }


        if (
          typeof
          entry.codePoint
          !==
          "string"
          ||
          !/^[0-9A-F]+$/i.test(
            entry.codePoint
          )
        ) {

          throw new Error(
            "invalid code point"
          );

        }


        const codePoint =
          parseInt(
            entry.codePoint,
            16
          );


        if (
          !Number.isInteger(
            codePoint
          )
          ||
          codePoint < 0
          ||
          codePoint > 0x10FFFF
          ||
          (
            codePoint >= 0xD800 &&
            codePoint <= 0xDFFF
          )
        ) {

          throw new Error(
            "invalid code point"
          );

        }


        const character =
          String.fromCodePoint(
            codePoint
          );


        const hex =
          codePoint
            .toString(
              16
            )
            .toUpperCase();


        const fontClass =
          getFontClass(
            codePoint
          );


        dailyCharacter.className =
          "character "
          +
          fontClass
          +
          " loading-character";


        /*
          不可視文字なら
          文字そのものではなく表示する
        */

        if (
          isInvisibleCharacter(
            codePoint,
            character
          )
        ) {

          dailyCharacter.className =
            "character font-normal";


          dailyCharacter.textContent =
            "不可視";


        } else {

          dailyCharacter.textContent =
            character;

        }


        dailyCode.textContent =
          "U+" +
          hex;


        const searchQuery =
          character
          +
          " U+"
          +
          hex
          +
          " Unicode";


        dailyResearchLink.href =
          "https://www.google.com/search?q="
          +
          encodeURIComponent(
            searchQuery
          );


        if (
          !isInvisibleCharacter(
            codePoint,
            character
          )
        ) {

          await waitForCharacterFont(
            codePoint,
            character
          );


          const style =
            getComputedStyle(
              dailyCharacter
            );


          const fontFamily =
            style.fontFamily;


          /*
            完全に空白だった場合
          */

          if (
            isRenderedBlank(
              character,
              fontFamily
            )
          ) {

            dailyCharacter.className =
              "character font-normal";


            dailyCharacter.textContent =
              "空白";


          /*
            □ / 三本線
          */

          } else if (
            looksLikeMissingGlyph(
              character,
              fontFamily
            )
          ) {

            dailyCharacter.className =
              "character font-normal";


            dailyCharacter.textContent =
              "未対応";


          } else {

            /*
              Egyptian Extended-Aの
              小さい字形を自動拡大
            */

            applyDailyGlyphScale(
              dailyCharacter,
              codePoint,
              character
            );

          }

        }


        dailyCharacter
          .classList
          .remove(
            "loading-character"
          );


        dailyResearchLink
          .classList
          .remove(
            "disabled"
          );

      } catch (
        error
      ) {

        console.error(
          error
        );


        dailyCharacter.className =
          "character font-normal";


        dailyCharacter.textContent =
          "？";


        dailyCode.textContent =
          "更新待ち";

      }
    }


    /* ================================= */
    /* 起動 */
    /* ================================= */

    updateBackButton();


    loadDailyCharacter();


    let lastJSTDate =
      getJSTDateString();


    setInterval(
      () => {

        const now =
          getJSTDateString();


        if (
          now !==
          lastJSTDate
        ) {

          lastJSTDate =
            now;


          loadDailyCharacter();

        }

      },
      60000
    );

  </script>

</body>
</html>
