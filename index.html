<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>文字 ⇄ Unicode 変換</title>

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <!-- Kawi -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kawi&display=swap"
    rel="stylesheet"
  >

  <!-- Toto -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Toto&display=swap"
    rel="stylesheet"
  >

  <!-- Tangut -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tangut&display=swap"
    rel="stylesheet"
  >

  <!-- Nüshu -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Nushu&display=swap"
    rel="stylesheet"
  >

  <!-- Khitan Small Script -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Khitan+Small+Script&display=swap"
    rel="stylesheet"
  >

  <!-- Cuneiform -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Cuneiform&display=swap"
    rel="stylesheet"
  >

  <!-- Egyptian Hieroglyphs -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&display=swap"
    rel="stylesheet"
  >

  <style>
    @font-face {
      font-family: "Tangut Extended";

      src:
        url("./tangut-extended.woff2")
        format("woff2");

      font-display: swap;
    }

    @font-face {
      font-family: "BabelStone Han";

      src:
        url(
          "https://babelstone.co.uk/Fonts/WOFF/BabelStoneHan.woff"
        )
        format("woff");

      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      padding:
        24px 16px
        60px;

      background:
        #f5f5f7;

      color:
        #1d1d1f;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;

      max-width:
        760px;

      margin:
        0 auto;
    }

    h1 {
      margin:
        0 0 24px;

      text-align:
        center;

      font-size:
        28px;
    }

    .box {
      margin-bottom:
        20px;

      padding:
        20px;

      background:
        white;

      border-radius:
        18px;

      box-shadow:
        0 2px 12px
        rgba(
          0,
          0,
          0,
          0.06
        );
    }

    h2 {
      margin:
        0 0 14px;

      font-size:
        19px;
    }

    textarea,
    input {
      width:
        100%;

      padding:
        14px;

      border:
        1px solid
        #d2d2d7;

      border-radius:
        12px;

      background:
        #fff;

      color:
        #1d1d1f;

      font: inherit;

      font-size:
        17px;

      outline:
        none;
    }

    textarea {
      min-height:
        100px;

      resize:
        vertical;
    }

    textarea:focus,
    input:focus {
      border-color:
        #007aff;
    }

    .hint {
      margin-top:
        8px;

      color:
        #777;

      font-size:
        13px;

      line-height:
        1.5;
    }

    .result {
      min-height:
        62px;

      margin-top:
        14px;

      padding:
        14px;

      background:
        #f5f5f7;

      border-radius:
        12px;

      overflow-wrap:
        anywhere;

      line-height:
        1.7;
    }

    .unicode-result {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        monospace;

      font-size:
        16px;
    }

    .character-result {
      min-height:
        90px;

      font-size:
        48px;

      line-height:
        1.4;
    }

    .character-span {
      position:
        relative;

      display:
        inline-flex;

      min-width:
        1em;

      min-height:
        1.3em;

      align-items:
        center;

      justify-content:
        center;

      vertical-align:
        middle;
    }

    button {
      margin-top:
        12px;

      padding:
        10px 16px;

      border:
        0;

      border-radius:
        10px;

      background:
        #e8e8ed;

      color:
        #1d1d1f;

      font:
        inherit;

      cursor:
        pointer;
    }

    button:active {
      transform:
        scale(0.98);
    }

    /* ------------------------- */
    /* 今日の一文字 */
    /* ------------------------- */

    #dailyCharacterBox {
      margin-bottom:
        22px;

      padding:
        24px 20px;

      background:
        white;

      border-radius:
        20px;

      text-align:
        center;

      box-shadow:
        0 2px 14px
        rgba(
          0,
          0,
          0,
          0.07
        );
    }

    #dailyTitle {
      margin-bottom:
        12px;

      font-size:
        15px;

      font-weight:
        600;

      color:
        #666;
    }

    #dailyCharacter {
      position:
        relative;

      display:
        flex;

      width:
        100%;

      min-height:
        130px;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        92px;

      line-height:
        1.2;
    }

    #dailyCode {
      margin-top:
        6px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        monospace;

      font-size:
        17px;

      color:
        #555;
    }

    #dailyResearch {
      margin-top:
        14px;
    }

    #dailyResearchLink {
      color:
        #007aff;

      text-decoration:
        none;

      font-size:
        15px;
    }

    #dailyResearchLink:hover {
      text-decoration:
        underline;
    }

    #dailyResearchLink.disabled {
      opacity:
        0;

      pointer-events:
        none;
    }

    /* ------------------------- */
    /* フォント */
    /* ------------------------- */

    .font-normal {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .font-kawi {
      font-family:
        "Noto Sans Kawi",
        sans-serif;
    }

    .font-toto {
      font-family:
        "Noto Serif Toto",
        serif;
    }

    .font-tangut {
      font-family:
        "Noto Serif Tangut",
        serif;
    }

    .font-tangut-extended {
      font-family:
        "Tangut Extended",
        "Noto Serif Tangut",
        serif;
    }

    .font-nushu {
      font-family:
        "Noto Sans Nushu",
        sans-serif;
    }

    .font-khitan {
      font-family:
        "Noto Serif Khitan Small Script",
        serif;
    }

    .font-cuneiform {
      font-family:
        "Noto Sans Cuneiform",
        sans-serif;
    }

    .font-egyptian {
      font-family:
        "Noto Sans Egyptian Hieroglyphs",
        sans-serif;
    }

    .font-cjk-ext {
      font-family:
        "BabelStone Han",
        serif;
    }

    /* ------------------------- */
    /* フォント読み込み中 */
    /* ------------------------- */

    .loading-character {
      position:
        relative;

      color:
        transparent !important;
    }

    .loading-character::after {
      content:
        "";

      position:
        absolute;

      width:
        28px;

      height:
        28px;

      top:
        50%;

      left:
        50%;

      margin:
        -14px 0
        0 -14px;

      border:
        3px solid
        rgba(
          120,
          120,
          120,
          0.25
        );

      border-top-color:
        rgba(
          80,
          80,
          80,
          0.9
        );

      border-radius:
        50%;

      animation:
        spinner 0.8s
        linear infinite;
    }

    @keyframes spinner {
      to {
        transform:
          rotate(360deg);
      }
    }

    @media (
      max-width:
      520px
    ) {
      body {
        padding:
          18px 12px
          50px;
      }

      h1 {
        font-size:
          24px;
      }

      .box {
        padding:
          17px;
      }

      #dailyCharacter {
        min-height:
          115px;

        font-size:
          78px;
      }

      .character-result {
        font-size:
          42px;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>
      文字 ⇄ Unicode
    </h1>

    <!-- 今日の一文字 -->

    <section
      id="dailyCharacterBox"
    >

      <div
        id="dailyTitle"
      >
        今日の一文字
      </div>

      <div
        id="dailyCharacter"
        class="
          character
          loading-character
        "
      >
        ?
      </div>

      <div
        id="dailyCode"
      >
        読み込み中…
      </div>

      <div
        id="dailyResearch"
      >
        <a
          id="dailyResearchLink"
          class="disabled"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          この文字について調べる
        </a>
      </div>

    </section>


    <!-- 文字 → Unicode -->

    <section
      class="box"
    >

      <h2>
        文字 → Unicode
      </h2>

      <textarea
        id="charInput"
        placeholder="文字を入力"
      ></textarea>

      <div
        id="unicodeOutput"
        class="
          result
          unicode-result
        "
      ></div>

      <button
        id="clearChar"
        type="button"
      >
        クリア
      </button>

    </section>


    <!-- Unicode → 文字 -->

    <section
      class="box"
    >

      <h2>
        Unicode → 文字
      </h2>

      <input
        id="unicodeInput"
        type="text"
        placeholder="例: 1E290 または U+1E290"
      >

      <div
        class="hint"
      >
        U+1E290 / 1E290 /
        0x1E290 に対応。
        複数入力は空白・改行・カンマで区切れます。
      </div>

      <div
        id="charOutput"
        class="
          result
          character-result
        "
      ></div>

      <button
        id="clearUnicode"
        type="button"
      >
        クリア
      </button>

    </section>

  </main>


  <script>
    const charInput =
      document.getElementById(
        "charInput"
      );

    const unicodeInput =
      document.getElementById(
        "unicodeInput"
      );

    const unicodeOutput =
      document.getElementById(
        "unicodeOutput"
      );

    const charOutput =
      document.getElementById(
        "charOutput"
      );

    const clearChar =
      document.getElementById(
        "clearChar"
      );

    const clearUnicode =
      document.getElementById(
        "clearUnicode"
      );

    const dailyCharacter =
      document.getElementById(
        "dailyCharacter"
      );

    const dailyCode =
      document.getElementById(
        "dailyCode"
      );

    const dailyResearchLink =
      document.getElementById(
        "dailyResearchLink"
      );


    /* ================================= */
    /* フォント判定 */
    /* ================================= */

    function getFontClass(
      codePoint
    ) {

      /*
        Kawi
        U+11F00–U+11F5F
      */

      if (
        codePoint >= 0x11F00 &&
        codePoint <= 0x11F5F
      ) {
        return "font-kawi";
      }


      /*
        Toto
        U+1E290–U+1E2BF
      */

      if (
        codePoint >= 0x1E290 &&
        codePoint <= 0x1E2BF
      ) {
        return "font-toto";
      }


      /*
        新しいTangut文字

        ローカルの
        tangut-extended.woff2
        を使用
      */

      if (
        (
          codePoint >= 0x187F8 &&
          codePoint <= 0x187FF
        )
        ||
        (
          codePoint >= 0x18D09 &&
          codePoint <= 0x18D1E
        )
        ||
        (
          codePoint >= 0x18D80 &&
          codePoint <= 0x18DFF
        )
      ) {
        return "font-tangut-extended";
      }


      /*
        Tangut Iteration Mark

        U+16FE0

        Tangut本体とは
        別ブロックに存在する
      */

      if (
        codePoint === 0x16FE0
      ) {
        return "font-tangut";
      }


      /*
        Tangut 本体
      */

      if (
        (
          codePoint >= 0x17000 &&
          codePoint <= 0x187F7
        )
        ||
        (
          codePoint >= 0x18D00 &&
          codePoint <= 0x18D08
        )
      ) {
        return "font-tangut";
      }


      /*
        Nüshu Iteration Mark
        U+16FE1
      */

      if (
        codePoint === 0x16FE1
      ) {
        return "font-nushu";
      }


      /*
        Nüshu

        U+1B170–U+1B2FF
      */

      if (
        codePoint >= 0x1B170 &&
        codePoint <= 0x1B2FF
      ) {
        return "font-nushu";
      }


      /*
        Khitan Small Script

        U+18B00–U+18CFF
      */

      if (
        codePoint >= 0x18B00 &&
        codePoint <= 0x18CFF
      ) {
        return "font-khitan";
      }


      /*
        Cuneiform
      */

      if (
        (
          codePoint >= 0x12000 &&
          codePoint <= 0x123FF
        )
        ||
        (
          codePoint >= 0x12400 &&
          codePoint <= 0x1247F
        )
        ||
        (
          codePoint >= 0x12480 &&
          codePoint <= 0x1254F
        )
      ) {
        return "font-cuneiform";
      }


      /*
        Egyptian Hieroglyphs

        通常領域 +
        Extended-A
      */

      if (
        (
          codePoint >= 0x13000 &&
          codePoint <= 0x1345F
        )
        ||
        (
          codePoint >= 0x13460 &&
          codePoint <= 0x143FF
        )
      ) {
        return "font-egyptian";
      }


      /*
        CJK Unified
        Ideographs Extensions

        U+20000–U+323AF
      */

      if (
        codePoint >= 0x20000 &&
        codePoint <= 0x323AF
      ) {
        return "font-cjk-ext";
      }


      return "font-normal";
    }


    /* ================================= */
    /* CSSクラス → 実際のフォント名 */
    /* ================================= */

    function getWebFontName(
      codePoint
    ) {

      const fontClass =
        getFontClass(
          codePoint
        );

      switch (
        fontClass
      ) {

        case "font-kawi":
          return "Noto Sans Kawi";

        case "font-toto":
          return "Noto Serif Toto";

        case "font-tangut":
          return "Noto Serif Tangut";

        case "font-tangut-extended":
          return "Tangut Extended";

        case "font-nushu":
          return "Noto Sans Nushu";

        case "font-khitan":
          return "Noto Serif Khitan Small Script";

        case "font-cuneiform":
          return "Noto Sans Cuneiform";

        case "font-egyptian":
          return "Noto Sans Egyptian Hieroglyphs";

        case "font-cjk-ext":
          return "BabelStone Han";

        default:
          return null;
      }
    }


    /* ================================= */
    /* フォント読み込み待機 */
    /* ================================= */

    function sleep(
      milliseconds
    ) {

      return new Promise(
        (resolve) => {

          setTimeout(
            resolve,
            milliseconds
          );

        }
      );
    }


    async function waitForCharacterFont(
      codePoint,
      character
    ) {

      const fontName =
        getWebFontName(
          codePoint
        );

      /*
        特別なフォントが
        不要な文字
      */

      if (
        !fontName
      ) {
        return;
      }


      /*
        Font Loading APIが
        ないブラウザ
      */

      if (
        !document.fonts
      ) {

        await sleep(
          1000
        );

        return;
      }


      try {

        await Promise.race(
          [

            document.fonts.load(
              `72px "${fontName}"`,
              character
            ),

            /*
              ネットワークなどで
              永遠にぐるぐるに
              ならないようにする
            */

            sleep(
              5000
            )

          ]
        );

      } catch (
        error
      ) {

        console.warn(
          "Font loading failed:",
          fontName,
          error
        );

      }
    }


    /* ================================= */
    /* 文字 → Unicode */
    /* ================================= */

    function convertCharacters() {

      const text =
        charInput.value;

      if (
        text.length === 0
      ) {

        unicodeOutput.textContent =
          "";

        return;
      }


      const result =
        Array.from(
          text
        )
        .map(
          (character) => {

            const codePoint =
              character.codePointAt(
                0
              );

            return (
              "U+" +
              codePoint
                .toString(
                  16
                )
                .toUpperCase()
            );
          }
        );


      unicodeOutput.textContent =
        result.join(
          " "
        );
    }


    /* ================================= */
    /* Unicode解析 */
    /* ================================= */

    function parseUnicodeToken(
      token
    ) {

      let value =
        token.trim();

      if (
        value.length === 0
      ) {
        return null;
      }


      value =
        value.replace(
          /^U\+/i,
          ""
        );

      value =
        value.replace(
          /^0x/i,
          ""
        );


      if (
        !/^[0-9A-F]+$/i.test(
          value
        )
      ) {
        return null;
      }


      const codePoint =
        parseInt(
          value,
          16
        );


      if (
        !Number.isInteger(
          codePoint
        )
      ) {
        return null;
      }


      if (
        codePoint < 0 ||
        codePoint > 0x10FFFF
      ) {
        return null;
      }


      /*
        UTF-16サロゲート領域は
        Unicode scalar valueではない
      */

      if (
        codePoint >= 0xD800 &&
        codePoint <= 0xDFFF
      ) {
        return null;
      }


      return codePoint;
    }


    let unicodeRun =
      0;


    async function convertUnicode() {

      const currentRun =
        ++unicodeRun;

      const raw =
        unicodeInput.value.trim();


      if (
        raw.length === 0
      ) {

        charOutput.textContent =
          "";

        return;
      }


      const tokens =
        raw
          .split(
            /[\s,]+/
          )
          .filter(
            Boolean
          );


      const codePoints =
        [];


      for (
        const token of tokens
      ) {

        const codePoint =
          parseUnicodeToken(
            token
          );


        if (
          codePoint === null
        ) {

          charOutput.className =
            "result character-result";

          charOutput.textContent =
            "無効なUnicodeです";

          return;
        }


        codePoints.push(
          codePoint
        );
      }


      charOutput.className =
        "result character-result";

      charOutput.textContent =
        "";


      const promises =
        [];


      for (
        const codePoint
        of codePoints
      ) {

        const character =
          String.fromCodePoint(
            codePoint
          );

        const fontClass =
          getFontClass(
            codePoint
          );

        const span =
          document.createElement(
            "span"
          );


        span.className =
          "character-span " +
          fontClass;


        span.textContent =
          character;


        const specialFont =
          getWebFontName(
            codePoint
          );


        if (
          specialFont
        ) {

          span.classList.add(
            "loading-character"
          );

        }


        charOutput.appendChild(
          span
        );


        if (
          specialFont
        ) {

          const promise =
            waitForCharacterFont(
              codePoint,
              character
            )
            .then(
              () => {

                if (
                  currentRun !==
                  unicodeRun
                ) {
                  return;
                }


                span.classList.remove(
                  "loading-character"
                );

              }
            );


          promises.push(
            promise
          );

        }

      }


      await Promise.all(
        promises
      );
    }


    /* ================================= */
    /* 入力イベント */
    /* ================================= */

    charInput.addEventListener(
      "input",
      convertCharacters
    );


    unicodeInput.addEventListener(
      "input",
      convertUnicode
    );


    clearChar.addEventListener(
      "click",
      () => {

        charInput.value =
          "";

        unicodeOutput.textContent =
          "";

        charInput.focus();

      }
    );


    clearUnicode.addEventListener(
      "click",
      () => {

        unicodeRun++;

        unicodeInput.value =
          "";

        charOutput.textContent =
          "";

        unicodeInput.focus();

      }
    );


    /* ================================= */
    /* JSTの日付 */
    /* ================================= */

    function getJSTDateString() {

      const parts =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone:
              "Asia/Tokyo",

            year:
              "numeric",

            month:
              "2-digit",

            day:
              "2-digit"
          }
        )
        .formatToParts(
          new Date()
        );


      const part =
        (type) =>
          parts.find(
            (p) =>
              p.type === type
          )?.value;


      return (
        part(
          "year"
        )
        +
        "-"
        +
        part(
          "month"
        )
        +
        "-"
        +
        part(
          "day"
        )
      );
    }


    /* ================================= */
    /* 今日の一文字 */
    /* ================================= */

    async function loadDailyCharacter() {

      dailyCharacter.className =
        "character loading-character";

      dailyCharacter.textContent =
        "?";

      dailyCode.textContent =
        "読み込み中…";

      dailyResearchLink
        .classList
        .add(
          "disabled"
        );

      dailyResearchLink.href =
        "#";


      try {

        /*
          ?t= を付けて
          daily.jsonのキャッシュを
          強制回避
        */

        const response =
          await fetch(
            "./daily.json?t=" +
            Date.now(),
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "daily.json load failed"
          );

        }


        const data =
          await response.json();


        const today =
          getJSTDateString();


        const entries =
          [
            data.current,
            data.next
          ]
          .filter(
            Boolean
          );


        /*
          JSTの日付が
          今日と一致する方を使う
        */

        const entry =
          entries.find(
            (item) =>
              item.date === today
          );


        if (
          !entry
        ) {

          throw new Error(
            "today entry not found"
          );

        }


        if (
          typeof
          entry.codePoint
          !==
          "string"
        ) {

          throw new Error(
            "invalid code point"
          );

        }


        if (
          !/^[0-9A-F]+$/i.test(
            entry.codePoint
          )
        ) {

          throw new Error(
            "invalid code point"
          );

        }


        const codePoint =
          parseInt(
            entry.codePoint,
            16
          );


        if (
          !Number.isInteger(
            codePoint
          )
          ||
          codePoint < 0
          ||
          codePoint > 0x10FFFF
          ||
          (
            codePoint >= 0xD800 &&
            codePoint <= 0xDFFF
          )
        ) {

          throw new Error(
            "invalid code point"
          );

        }


        const character =
          String.fromCodePoint(
            codePoint
          );


        const hex =
          codePoint
            .toString(
              16
            )
            .toUpperCase();


        const fontClass =
          getFontClass(
            codePoint
          );


        dailyCharacter.className =
          "character "
          +
          fontClass
          +
          " loading-character";


        dailyCharacter.textContent =
          character;


        dailyCode.textContent =
          "U+" +
          hex;


        /*
          Google検索
        */

        const searchQuery =
          character
          +
          " U+"
          +
          hex
          +
          " Unicode";


        dailyResearchLink.href =
          "https://www.google.com/search?q="
          +
          encodeURIComponent(
            searchQuery
          );


        /*
          必要なWebフォントが
          読み終わるまで待つ
        */

        await waitForCharacterFont(
          codePoint,
          character
        );


        dailyCharacter
          .classList
          .remove(
            "loading-character"
          );


        dailyResearchLink
          .classList
          .remove(
            "disabled"
          );

      } catch (
        error
      ) {

        console.error(
          error
        );


        dailyCharacter.className =
          "character font-normal";


        dailyCharacter.textContent =
          "？";


        dailyCode.textContent =
          "更新待ち";

      }
    }


    /* 最初に読み込む */

    loadDailyCharacter();


    /*
      ページを開きっぱなしでも
      JST 0:00をまたいだら
      今日の文字を更新
    */

    let lastJSTDate =
      getJSTDateString();


    setInterval(
      () => {

        const now =
          getJSTDateString();


        if (
          now !==
          lastJSTDate
        ) {

          lastJSTDate =
            now;

          loadDailyCharacter();

        }

      },
      60000
    );

  </script>

</body>
</html>
